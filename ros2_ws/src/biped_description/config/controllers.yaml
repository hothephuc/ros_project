controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

leg_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
